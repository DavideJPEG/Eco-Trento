<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I Miei Orari - ECOTRENTO</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-main: #080810;
            --bg-card: rgba(18, 18, 30, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-green: #00ff88;
            --accent-blue: #00d2ff;
            --text-muted: #8a8a9e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* --- HEADER CONTROL PANELS --- */
        .header-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            padding: 20px 30px;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .back-btn:hover {
            color: #ffffff;
            background: rgba(255,255,255,0.04);
            border-color: var(--border-glass);
        }

        .zone-selector {
            background: #121220;
            color: white;
            border: 1px solid var(--border-glass);
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
        }

        .zone-selector:focus {
            border-color: var(--accent-blue);
        }

        /* --- GRID TIMELINE SETTIMANALE --- */
        .timeline-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .day-card {
            background: var(--bg-card);
            backdrop-filter: blur(15px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            transition: transform 0.3s;
        }

        .day-card:hover {
            transform: translateY(-2px);
        }

        .day-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-title span.today-badge {
            font-size: 11px;
            background: rgba(0, 255, 136, 0.15);
            color: var(--accent-green);
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        .rifiuto-item {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .rifiuto-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .rifiuto-info i {
            font-size: 18px;
        }

        .rifiuto-name {
            font-size: 14px;
            font-weight: 700;
        }

        .rifiuto-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .time-limit {
            font-family: monospace;
            font-size: 12px;
            background: rgba(255,255,255,0.05);
            padding: 4px 8px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .no-waste {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
            text-align: center;
            margin: auto 0;
            padding: 20px 0;
        }

        /* Colori Icone */
        .color-imballaggi { color: #eccc68; }
        .color-carta { color: #1e90ff; }
        .color-organico { color: #ffa502; }
        .color-residuo { color: #747d8c; }
    </style>
</head>
<body>

    <div id="app" class="container">
        
        <header class="header-area">
            <a class="back-btn" href="main.html">
                <i class="fa-solid fa-arrow-left"></i> Torna alla Mappa
            </a>
            
            <div style="display:flex; align-items:center; gap:12px;">
                <label style="font-size:14px; color: var(--text-muted);">Visualizza Zona:</label>
                <select class="zone-selector" v-model="currentZona" @change="updateCalendar">
                    <option value="Oltrefersina">Zona Oltrefersina / Clarina</option>
                    <option value="Centro">Centro Storico</option>
                </select>
            </div>
        </header>

        <div style="text-align: center; margin: 10px 0;">
            <h1 style="font-size: 28px; font-weight: 800; letter-spacing: 1px;">Calendario di Raccolta Settimanale</h1>
            <p style="color: var(--text-muted); margin-top: 5px;">Mostrato in base alla circoscrizione selezionata</p>
        </div>

        <div class="timeline-grid">
            
            <div v-for="giorno in giorniSettimana" :key="giorno.nome" class="day-card">
                <div class="day-title">
                    <span>{{ giorno.nome }}</span>
                    <span v-if="isToday(giorno.nome)" class="today-badge">Oggi</span>
                </div>

                <div v-if="getRaccolteGiorno(giorno.nome).length > 0" style="display:flex; flex-direction:column; gap:10px;">
                    <div v-for="raccolta in getRaccolteGiorno(giorno.nome)" :key="raccolta.rifiuto" class="rifiuto-item">
                        <div class="rifiuto-info">
                            <i :class="['fa-solid', getIconClass(raccolta.rifiuto), getColorClass(raccolta.rifiuto)]"></i>
                            <div>
                                <div class="rifiuto-name">{{ raccolta.rifiuto }}</div>
                                <div class="rifiuto-desc">{{ raccolta.desc }}</div>
                            </div>
                        </div>
                        <div class="time-limit">
                            <i class="fa-regular fa-clock"></i> {{ raccolta.orario }}
                        </div>
                    </div>
                </div>

                <div v-else class="no-waste">
                    <i class="fa-solid fa-calendar-check" style="margin-right: 5px; color: var(--accent-green)"></i> Nessuna esposizione prevista
                </div>

            </div>

        </div>

    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    currentZona: 'Oltrefersina', // Valore di default coerente con la tua via
                    giorniSettimana: [
                        { nome: 'Lunedì' }, { nome: 'Martedì' }, { nome: 'Mercoledì' },
                        { nome: 'Giovedì' }, { nome: 'Venerdì' }, { nome: 'Sabato' }
                    ],
                    // DATABASE REALE DEL PORTA A PORTA DI TRENTO (Strutturato per essere dinamico)
                    calendariorifiuti: {
                        Oltrefersina: [
                            { giorno: 'Lunedì', rifiuto: 'Organico', orario: 'Entro 11:00', desc: 'Svuotamento mastello marrone' },
                            { giorno: 'Martedì', rifiuto: 'Imballaggi Leggeri', orario: 'Entro 13:00', desc: 'Esporre Sacco Azzurro' }, // Coerente al 100%!
                            { giorno: 'Mercoledì', rifiuto: 'Organico', orario: 'Entro 11:00', desc: 'Svuotamento mastello marrone' },
                            { giorno: 'Giovedì', rifiuto: 'Carta', orario: 'Entro 12:00', desc: 'Esporre sacco/mastello bianco' },
                            { giorno: 'Venerdì', rifiuto: 'Organico', orario: 'Entro 11:00', desc: 'Svuotamento mastello marrone' },
                            { giorno: 'Sabato', rifiuto: 'Secco Residuo', orario: 'Entro 13:00', desc: 'Svuotamento mastello verde scuro' }
                        ],
                        Centro: [
                            { giorno: 'Lunedì', rifiuto: 'Imballaggi Leggeri', orario: 'Entro 09:00', desc: 'Esporre Sacco Azzurro' },
                            { giorno: 'Martedì', rifiuto: 'Organico', orario: 'Entro 08:30', desc: 'Svuotamento mastello marrone' },
                            { giorno: 'Mercoledì', rifiuto: 'Carta', orario: 'Entro 09:00', desc: 'Esporre sacco/mastello bianco' },
                            { giorno: 'Giovedì', rifiuto: 'Organico', orario: 'Entro 08:30', desc: 'Svuotamento mastello marrone' },
                            { giorno: 'Venerdì', rifiuto: 'Secco Residuo', orario: 'Entro 09:00', desc: 'Svuotamento mastello verde scuro' },
                            { giorno: 'Sabato', rifiuto: 'Organico', orario: 'Entro 08:30', desc: 'Svuotamento mastello marrone' }
                        ]
                    }
                }
            },
            methods: {
                // Filtra il calendario in base al giorno e alla circoscrizione attiva
                getRaccolteGiorno(giornoNome) {
                    return this.calendariorifiuti[this.currentZona].filter(r => r.giorno === giornoNome);
                },
                getIconClass(rifiuto) {
                    if (rifiuto.includes("Imballaggi")) return "fa-box-open";
                    if (rifiuto.includes("Carta")) return "fa-file-lines";
                    if (rifiuto.includes("Organico")) return "fa-apple-whole";
                    return "fa-trash-can";
                },
                getColorClass(rifiuto) {
                    if (rifiuto.includes("Imballaggi")) return "color-imballaggi";
                    if (rifiuto.includes("Carta")) return "color-carta";
                    if (rifiuto.includes("Organico")) return "color-organico";
                    return "color-residuo";
                },
                // Calcola dinamicamente se è il giorno corrente per mostrare il badge "Oggi"
                isToday(giornoNome) {
                    const giorniEng = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
                    const oggiIndex = new Date().getDay();
                    return giorniEng[oggiIndex] === giornoNome;
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
