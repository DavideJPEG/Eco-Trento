<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendario Raccolta - ECOTRENTO</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-main: #080810;
            --bg-card: rgba(18, 18, 30, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-green: #00ff88;
            --accent-blue: #00d2ff;
            --text-muted: #8a8a9e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px; /* Più stretto per una singola card elegante */
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin-top: 5vh;
        }

        .header-area {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .back-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
        }

        .back-btn:hover { color: #ffffff; }

        /* --- CARD PRINCIPALE --- */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
        }

        .card h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--accent-blue);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 30px;
            text-align: left;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .zone-selector {
            background: rgba(255,255,255,0.03);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            outline: none;
            transition: 0.3s;
            width: 100%;
        }

        .zone-selector:focus { border-color: var(--accent-green); background: rgba(255,255,255,0.06); }

        /* --- ZONA PDF --- */
        .pdf-area {
            background: rgba(0, 0, 0, 0.2);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .pdf-icon {
            font-size: 50px;
            color: #ff4757;
            filter: drop-shadow(0 0 10px rgba(255, 71, 87, 0.3));
        }

        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, var(--accent-green), #00b894);
            color: #080810;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 15px;
            transition: 0.3s;
            width: 100%;
            cursor: pointer;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3);
        }
        
        .loading-text { color: var(--text-muted); font-size: 14px; }
    </style>
</head>
<body>

    <div id="app" class="container">
        
        <header class="header-area">
            <a class="back-btn" href="main.html"><i class="fa-solid fa-arrow-left"></i> Torna alla Mappa</a>
        </header>

        <div class="card">
            <h1><i class="fa-regular fa-calendar-days"></i> Il Tuo Calendario</h1>
            <p class="subtitle">Seleziona la tua circoscrizione per consultare o stampare il calendario ufficiale della raccolta differenziata.</p>

            <div class="form-group">
                <label>Quartiere di Trento</label>
                <select class="zone-selector" v-model="selectedQuartiereUrl" @change="fetchPdfLink">
                    <option v-if="quartieri.length === 0 && !isMocking" value="">Caricamento zone in corso...</option>
                    
                    <!-- Cicla i quartieri trovati (il value sarà il link all'API del calendario) -->
                    <option v-for="q in quartieri" :key="q.self" :value="q.calendario">
                        {{ q.nome }}
                    </option>
                </select>
            </div>

            <div v-if="isLoading" class="pdf-area">
                <i class="fa-solid fa-spinner fa-spin pdf-icon" style="color: var(--accent-blue);"></i>
                <span class="loading-text">Recupero documento in corso...</span>
            </div>

            <div v-else-if="pdfLink" class="pdf-area">
                <i class="fa-regular fa-file-pdf pdf-icon"></i>
                <h3 style="font-size: 16px;">Calendario_Raccolta.pdf</h3>
                <p style="font-size: 12px; color: var(--text-muted);">Formato PDF Stampabile</p>
                
                <a :href="pdfLink" target="_blank" class="btn-primary">
                    <i class="fa-solid fa-print"></i> Apri e Stampa
                </a>
            </div>

        </div>

    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    quartieri: [],
                    selectedQuartiereUrl: '', // Conterrà es: '/api/v1/quartieri/123/calendario'
                    pdfLink: '',
                    isLoading: false,
                    isMocking: false // Ci dice se stiamo usando i dati finti di emergenza
                }
            },
            mounted() {
                this.fetchQuartieri();
            },
            methods: {
                // 1. Scarichiamo l'elenco dei quartieri
                async fetchQuartieri() {
                    try {
                        const response = await fetch('http://localhost:3000/api/v1/quartieri');
                        const data = await response.json();

                        if (data && data.length > 0) {
                            this.quartieri = data;
                            // Seleziono il primo di default e ne scarico il PDF
                            this.selectedQuartiereUrl = data[0].calendario;
                            this.fetchPdfLink();
                        } else {
                            throw new Error("Nessun quartiere nel database");
                        }
                    } catch (err) {
                        console.warn("Database vuoto o irraggiungibile. Attivo i dati finti per farti testare l'UI!");
                        this.abilitaDatiFinti();
                    }
                },

                // 2. Quando selezioniamo un quartiere, scarichiamo il link del suo calendario
                async fetchPdfLink() {
                    // Se stiamo usando i dati finti, saltiamo questo blocco
                    if (this.isMocking) {
                        this.pdfLink = 'https://www.dolomitiambiente.it/content/download/12411/129994/version/1/file/Trento_Centro.pdf';
                        return;
                    }

                    this.isLoading = true;
                    this.pdfLink = '';

                    try {
                        const response = await fetch('http://localhost:3000' + this.selectedQuartiereUrl);
                        const data = await response.json();
                        
                        if(data.link) {
                            this.pdfLink = data.link;
                        }
                    } catch (err) {
                        console.error("Errore nel caricamento del calendario", err);
                    } finally {
                        this.isLoading = false;
                    }
                },

                // 3. Il Salvagente (Mocking)
                abilitaDatiFinti() {
                    this.isMocking = true;
                    this.quartieri = [
                        { nome: 'Centro Storico (Dati Finti)', calendario: 'fake1' },
                        { nome: 'Oltrefersina (Dati Finti)', calendario: 'fake2' }
                    ];
                    this.selectedQuartiereUrl = 'fake1';
                    this.fetchPdfLink();
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
