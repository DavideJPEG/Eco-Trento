<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECOTN - Login & Registrazione</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <link rel="stylesheet" href="../css/global.css" />

    <style>
        body { 
            /* Sovrascriviamo lo sfondo base con il gradiente profondo per il login */
            background: radial-gradient(circle at center, #1a1a2e 0%, #080810 100%);
            overflow: hidden;
            align-items: center; /* Centra verticalmente il contenitore */
        }

        /* Decorazione: un cerchio sfocato che brilla dietro la card */
        body::before {
            content: "";
            position: absolute;
            width: 400px; height: 400px;
            background: var(--accent-blue);
            filter: blur(150px);
            opacity: 0.15;
            z-index: 0;
        }

        .login-container { 
            position: relative;
            z-index: 1;
            width: 400px; 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 40px; 
            border-radius: 24px; 
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
        }

        .login-container h1 { 
            margin-bottom: 30px; 
            text-align: center; 
            font-size: 28px; 
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(45deg, var(--accent-green), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tabs { 
            display: flex; 
            margin-bottom: 25px; 
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 12px;
        }

        .tabs button { 
            flex: 1; padding: 10px; border: none; cursor: pointer; 
            background: transparent; color: var(--text-muted);
            font-size: 14px; font-weight: 600;
            transition: 0.3s; border-radius: 10px;
        }

        .tabs button.active { 
            background: var(--accent-blue); 
            color: white; 
            box-shadow: 0 4px 15px rgba(74, 108, 247, 0.3);
        }

        .form { display: flex; flex-direction: column; gap: 15px; }

        .form input { 
            padding: 14px; 
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            color: white;
            font-size: 14px; 
            outline: none;
            transition: 0.3s;
        }

        .form input:focus {
            border-color: var(--accent-blue);
            background: rgba(255,255,255,0.08);
        }

        .form button.submit-btn { 
            margin-top: 10px;
            padding: 14px; 
            border: none; 
            border-radius: 12px; 
            background: linear-gradient(135deg, var(--accent-blue), #3555d3); 
            color: white; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: 700;
            transition: 0.3s;
        }

        .form button.submit-btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 108, 247, 0.4);
        }

        .error-msg { color: #ff4757; font-size: 12px; text-align: center; margin-bottom: 10px; font-weight: bold; }
        .success-msg { color: var(--accent-green); font-size: 14px; text-align: center; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="app" class="login-container">
    <h1>ECOTRENTO</h1>

    <div class="tabs">
        <button :class="{active: mode === 'login'}" @click="mode = 'login'">Login</button>
        <button :class="{active: mode === 'register'}" @click="mode = 'register'">Registrati</button>
    </div>

    <div v-if="errorMessage" class="error-msg">{{ errorMessage }}</div>
    <div v-if="successMessage" class="success-msg">{{ successMessage }}</div>

    <form v-if="mode === 'login'" class="form" @submit.prevent="handleLogin">
        <input type="email" v-model="loginData.email" placeholder="Email" required>
        <input type="password" v-model="loginData.password" placeholder="Password" required>
        <button type="submit" class="submit-btn">Accedi</button>
    </form>

    <form v-if="mode === 'register'" class="form" @submit.prevent="handleRegister">
        <input type="text" v-model="registerData.nome" placeholder="Nome" required>
        <input type="text" v-model="registerData.cognome" placeholder="Cognome" required>
        <input type="email" v-model="registerData.email" placeholder="Email" required>
        <input type="password" v-model="registerData.password" placeholder="Password" required>
        <button type="submit" class="submit-btn">Crea Account</button>
    </form>

</div>

<script src="../scripts/login.js"></script>

</body>
</html>
