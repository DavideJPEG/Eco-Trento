<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritiro Ingombranti - ECOTRENTO</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="../css/global.css" />

    <style>
        .card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .card h1 { font-size: 24px; margin-bottom: 5px; font-weight: 800; }
        p.subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 13px; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; }
        input, select { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; outline: none; }
        .btn-submit { background: linear-gradient(135deg, #4a6cf7, #3555d3); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; transition: 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(74, 108, 247, 0.4); }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; transition: 0.3s; }
        .back-link:hover { color: white; }
        .message { margin-top: 15px; text-align: center; font-size: 14px; font-weight: bold; }
        .success { color: var(--accent-green); }
        .error { color: var(--danger-red); }
    </style>
</head>
<body>
    <div id="app" class="container" style="max-width: 700px; margin-top: 5vh;" v-cloak>
        <a href="main.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> {{ t('torna_dashboard') }}</a>
        
        <div class="card">
            <h1>{{ t('ingom_titolo') }}</h1>
            <p class="subtitle">{{ t('ingom_sottotitolo') }}</p>

            <form @submit.prevent="submitRichiesta">
                <div class="form-group">
                    <label>{{ t('ingom_cosa_ritirare') }}</label>
                    <select v-model="form.oggetto" required>
                        <option value="" disabled>{{ t('ingom_ph_pezzo') }}</option>
                        <option value="Mobili">{{ t('ingom_opt_mobili') }}</option>
                        <option value="Grandi Elettrodomestici">{{ t('ingom_opt_elettro') }}</option>
                        <option value="Materassi">{{ t('ingom_opt_materassi') }}</option>
                        <option value="Altro">{{ t('ingom_opt_altro') }}</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>{{ t('ingom_data') }}</label>
                    <input type="date" v-model="form.data" required>
                </div>

                <div class="form-group">
                    <label>{{ t('ingom_fascia') }}</label>
                    <select v-model="form.fasciaOraria" required>
                        <option value="" disabled>{{ t('ingom_ph_orario') }}</option>
                        <option value="Mattina (08:00 - 12:00)">{{ t('ingom_opt_mattina') }}</option>
                        <option value="Pomeriggio (13:00 - 17:00)">{{ t('ingom_opt_pomeriggio') }}</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>{{ t('ingom_indirizzo') }}</label>
                    <input type="text" v-model="form.indirizzo" :placeholder="t('ingom_ph_indirizzo')" required>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fa-solid fa-truck"></i> {{ t('ingom_btn_prenota') }}
                </button>

                <p v-if="messaggio" :class="['message', tipoMessaggio]">{{ messaggio }}</p>
            </form>
        </div>
    </div>

    <script src="../common/security.js"></script>
    <script src="../common/lingue.js"></script>
    <script src="../scripts/ingombranti.js"></script>
</body>
</html>
