<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo - ECOTRENTO</title>
    
    <!-- Librerie Esterne -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <!-- CSS Globale -->
    <link rel="stylesheet" href="../css/global.css" />

    <!-- CSS Specifico del Profilo -->
    <style>
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; transition: 0.3s; }
        .back-link:hover { color: white; }

        .card { background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 35px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }

        .profile-header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; border-bottom: 1px solid var(--border-glass); padding-bottom: 20px; }

        .avatar { width: 70px; height: 70px; background: linear-gradient(135deg, var(--accent-blue), var(--accent-green)); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: #080810; font-weight: bold; }
        .user-info h1 { font-size: 24px; font-weight: 800; }
        .user-info p { color: var(--text-muted); font-size: 14px; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; }
        
        input { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; outline: none; transition: 0.3s; font-size: 15px; }
        input:focus:not(:disabled) { border-color: var(--accent-green); background: rgba(255,255,255,0.06); }
        input:disabled { color: var(--text-muted); border-color: transparent; background: transparent; padding-left: 0; }

        .switch-container { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 12px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }

        .buttons-area { display: flex; gap: 15px; margin-top: 30px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; text-align: center; }
        
        .btn-edit { background: rgba(255,255,255,0.1); color: white; }
        .btn-edit:hover { background: rgba(255,255,255,0.2); }
        .btn-save { background: linear-gradient(135deg, var(--accent-green), #00b894); color: #080810; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3); }
        .btn-logout { background: transparent; border: 1px solid var(--danger-red); color: var(--danger-red); }
        .btn-logout:hover { background: var(--danger-red); color: white; }

        .message { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        .success { color: var(--accent-green); }
        .error { color: var(--danger-red); }
    </style>
</head>
<body>

    <div id="app" class="container" style="max-width: 600px; margin-top: 5vh;">
        <a href="main.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Torna alla Dashboard</a>
        
        <div class="card">
            <p v-if="messaggio" :class="['message', tipoMessaggio]">{{ messaggio }}</p>

            <div v-if="isLoading" style="text-align: center; padding: 40px; color: var(--text-muted);">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 10px;">Caricamento profilo...</p>
            </div>

            <div v-else>
                <div class="profile-header">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-info">
                        <h1>{{ form.nome || 'Utente' }} {{ form.cognome }}</h1>
                        <p>{{ userEmail }} • Ruolo: {{ userRuolo }}</p>
                    </div>
                </div>

                <form @submit.prevent="salvaModifiche">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" v-model="form.nome" :disabled="!isEditing" placeholder="Inserisci il tuo nome">
                    </div>

                    <div class="form-group">
                        <label>Cognome</label>
                        <input type="text" v-model="form.cognome" :disabled="!isEditing" placeholder="Inserisci il tuo cognome">
                    </div>

                    <div class="form-group">
                        <label>Indirizzo Principale</label>
                        <input type="text" v-model="form.indirizzoPrincipale" :disabled="!isEditing" placeholder="Via / Piazza">
                    </div>

                    <h3 style="font-size: 14px; margin: 20px 0 10px 0; color: var(--text-muted);">Preferenze Notifiche</h3>
                    
                    <div class="switch-container" style="margin-bottom: 10px;">
                        <span><i class="fa-solid fa-bell" style="color: var(--accent-blue); margin-right: 8px;"></i> Notifiche App</span>
                        <input type="checkbox" v-model="form.notificaApp" :disabled="!isEditing">
                    </div>

                    <div class="switch-container">
                        <span><i class="fa-solid fa-envelope" style="color: var(--accent-blue); margin-right: 8px;"></i> Notifiche Email</span>
                        <input type="checkbox" v-model="form.notificaEmail" :disabled="!isEditing">
                    </div>

                    <div class="buttons-area">
                        <button v-if="!isEditing" type="button" class="btn btn-edit" @click="isEditing = true">
                            <i class="fa-solid fa-pen"></i> Modifica Dati
                        </button>
                        
                        <button v-if="isEditing" type="submit" class="btn btn-save">
                            <i class="fa-solid fa-check"></i> Salva Modifiche
                        </button>

                        <button v-if="!isEditing" type="button" class="btn btn-logout" @click="eseguiLogout">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Esci
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Script di Sicurezza Globale -->
    <script src="../common/security.js"></script>

    <!-- Script della Pagina -->
    <script src="../scripts/profilo.js"></script>
</body>
</html>
