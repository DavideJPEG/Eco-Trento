<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Profilo - ECOTRENTO</title>
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        :root {
            --bg-main: #080810;
            --bg-card: rgba(18, 18, 30, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-green: #00ff88;
            --accent-blue: #00d2ff;
            --text-muted: #8a8a9e;
            --danger-red: #ff4757;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: var(--bg-main);
            color: #ffffff;
            min-height: 100vh;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .back-link:hover { color: white; }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 20px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: #080810;
            font-weight: bold;
        }

        .user-info h1 { font-size: 24px; font-weight: 800; }
        .user-info p { color: var(--text-muted); font-size: 14px; }

        .form-group { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 12px; font-weight: 700; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 1px; }
        
        input {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            color: white;
            outline: none;
            transition: 0.3s;
            font-size: 15px;
        }
        
        input:focus:not(:disabled) { border-color: var(--accent-green); background: rgba(255,255,255,0.06); }
        input:disabled { color: var(--text-muted); border-color: transparent; background: transparent; padding-left: 0; }

        /* Stile Toggle Switch per le notifiche */
        .switch-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .buttons-area {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .btn-edit { background: rgba(255,255,255,0.1); color: white; }
        .btn-edit:hover { background: rgba(255,255,255,0.2); }
        
        .btn-save { background: linear-gradient(135deg, var(--accent-green), #00b894); color: #080810; }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 255, 136, 0.3); }

        .btn-logout { background: transparent; border: 1px solid var(--danger-red); color: var(--danger-red); }
        .btn-logout:hover { background: var(--danger-red); color: white; }

        .message { text-align: center; font-size: 14px; font-weight: bold; margin-bottom: 15px; }
        .success { color: var(--accent-green); }
        .error { color: var(--danger-red); }
    </style>
</head>
<body>

    <div id="app" class="container">
        <a href="main.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Torna alla Dashboard</a>
        
        <div class="card">
            <p v-if="messaggio" :class="['message', tipoMessaggio]">{{ messaggio }}</p>

            <div v-if="isLoading" style="text-align: center; padding: 40px; color: var(--text-muted);">
                <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
                <p style="margin-top: 10px;">Caricamento profilo...</p>
            </div>

            <div v-else>
                <div class="profile-header">
                    <div class="avatar"><i class="fa-solid fa-user"></i></div>
                    <div class="user-info">
                        <h1>{{ form.nome || 'Utente' }} {{ form.cognome }}</h1>
                        <p>{{ userEmail }} • Ruolo: {{ userRuolo }}</p>
                    </div>
                </div>

                <form @submit.prevent="salvaModifiche">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" v-model="form.nome" :disabled="!isEditing" placeholder="Inserisci il tuo nome">
                    </div>

                    <div class="form-group">
                        <label>Cognome</label>
                        <input type="text" v-model="form.cognome" :disabled="!isEditing" placeholder="Inserisci il tuo cognome">
                    </div>

                    <div class="form-group">
                        <label>Indirizzo Principale</label>
                        <!-- In futuro diventerà una select con l'ID della via come per gli ingombranti -->
                        <input type="text" v-model="form.indirizzoPrincipale" :disabled="!isEditing" placeholder="Via / Piazza">
                    </div>

                    <h3 style="font-size: 14px; margin: 20px 0 10px 0; color: var(--text-muted);">Preferenze Notifiche</h3>
                    
                    <div class="switch-container" style="margin-bottom: 10px;">
                        <span><i class="fa-solid fa-bell" style="color: var(--accent-blue); margin-right: 8px;"></i> Notifiche App</span>
                        <input type="checkbox" v-model="form.notificaApp" :disabled="!isEditing">
                    </div>

                    <div class="switch-container">
                        <span><i class="fa-solid fa-envelope" style="color: var(--accent-blue); margin-right: 8px;"></i> Notifiche Email</span>
                        <input type="checkbox" v-model="form.notificaEmail" :disabled="!isEditing">
                    </div>

                    <div class="buttons-area">
                        <button v-if="!isEditing" type="button" class="btn btn-edit" @click="isEditing = true">
                            <i class="fa-solid fa-pen"></i> Modifica Dati
                        </button>
                        
                        <button v-if="isEditing" type="submit" class="btn btn-save">
                            <i class="fa-solid fa-check"></i> Salva Modifiche
                        </button>

                        <button v-if="!isEditing" type="button" class="btn btn-logout" @click="eseguiLogout">
                            <i class="fa-solid fa-arrow-right-from-bracket"></i> Esci
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // --- BLOCCO DI SICUREZZA INIZIALE ---
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'login.html'; 
        }
        // ------------------------------------

        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    isLoading: true,
                    isEditing: false,
                    messaggio: '',
                    tipoMessaggio: '',
                    userEmail: '',
                    userRuolo: '',
                    form: {
                        nome: '',
                        cognome: '',
                        indirizzoPrincipale: '',
                        notificaApp: true,
                        notificaEmail: false
                    }
                }
            },
            mounted() {
                this.caricaDatiUtente();
            },
            methods: {
                // 1. Legge i dati dal DB al caricamento della pagina (GET)
                async caricaDatiUtente() {
                    try {
                        const response = await fetch('http://localhost:3000/api/v1/utenti/me', {
                            headers: { 
                                'Authorization': 'Bearer ' + token,
                                'x-access-token': token
                            }
                        });

                        if (!response.ok) throw new Error("Errore nel caricamento dati");

                        const data = await response.json();
                        
                        if (data.success && data.user) {
                            // Campi sola lettura
                            this.userEmail = data.user.email;
                            this.userRuolo = data.user.ruolo;
                            
                            // Campi form
                            this.form.nome = data.user.nome || '';
                            this.form.cognome = data.user.cognome || '';
                            this.form.indirizzoPrincipale = data.user.indirizzoPrincipale || '';
                            
                            if (data.user.preferenzeNotifiche) {
                                this.form.notificaApp = data.user.preferenzeNotifiche.app;
                                this.form.notificaEmail = data.user.preferenzeNotifiche.email;
                            }
                        }
                    } catch (err) {
                        console.error(err);
                        this.messaggio = "Impossibile caricare il profilo. Il token potrebbe essere scaduto.";
                        this.tipoMessaggio = "error";
                    } finally {
                        this.isLoading = false;
                    }
                },

                // 2. Salva le modifiche nel DB (PATCH)
                async salvaModifiche() {
                    this.messaggio = "Salvataggio in corso...";
                    this.tipoMessaggio = "";
                    
                    try {
                        const response = await fetch('http://localhost:3000/api/v1/utenti/me', {
                            method: 'PATCH',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': 'Bearer ' + token,
                                'x-access-token': token
                            },
                            body: JSON.stringify(this.form)
                        });

                        const data = await response.json();

                        if (response.ok && data.success) {
                            this.messaggio = "Profilo aggiornato con successo!";
                            this.tipoMessaggio = "success";
                            this.isEditing = false; // Torna in modalità sola lettura
                            
                            // Aggiorno i dati nel localStorage casomai servano ad altre pagine
                            localStorage.setItem('user', JSON.stringify(data.user));
                        } else {
                            throw new Error(data.message || "Errore durante l'aggiornamento");
                        }
                    } catch (err) {
                        console.error(err);
                        this.messaggio = "Errore durante il salvataggio dei dati.";
                        this.tipoMessaggio = "error";
                    }
                },

                // 3. LOGOUT: Distrugge i pass segreti e ti butta fuori!
                eseguiLogout() {
                    if(confirm("Sei sicuro di voler uscire?")) {
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                        window.location.href = 'login.html';
                    }
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
